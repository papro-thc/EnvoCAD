[project]
name = "envocad"
version = "0.2.3"
description = "Interní nástroj ENVO pro elektro-dokumentaci FVE (jednopólová schémata, knihovna prvků)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "ezdxf>=1.1",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller"]

[project.scripts]
envocad = "envocad.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["envocad*"]

[tool.setuptools.package-data]
envocad = ["library/builtin/**/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
