[project]
name = "envocad"
version = "0.11.0"
description = "Interní nástroj ENVO pro elektro-dokumentaci FVE (jednopólová schémata, knihovna prvků)"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.6",
    "ezdxf>=1.1",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "segno>=1.6",
    "pypdf>=5.0",   # připomínky jako anotace PDF (QPdfWriter anotace neumí); čistý Python, BSD-3, bez závislostí
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "pyinstaller", "pypdfium2"]   # pypdfium2: test vykreslení PDF

[project.scripts]
envocad = "envocad.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["envocad*"]

[tool.setuptools.package-data]
envocad = ["library/builtin/**/*.json", "library/builtin/**/*.csv", "library/builtin/doc_templates/*.md", "cmd/aliases.json", "resources/icons/*.svg", "resources/*.json",
           "resources/icons/*.txt"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
