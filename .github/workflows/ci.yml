# Testy a build pro Linux i Windows na každém PR a pushi do main.
# Agentní PR (větve agent/*) při selhání opravuje workflow agent-fix-ci.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  guard:
    name: Licencovaná data a ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Žádná data z EPLAN Data Portalu / datasheety v gitu
        run: python tools/check_licensed_data.py
      - name: ruff
        run: pipx run ruff check .

  test:
    name: Testy (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]   # 3.14 = lokální prostředí vývoje
        include:
          # pokrytí kódu měří jen jeden job (report bez prahu, CI kvůli němu nepadá); ostatní běží bez --cov
          - os: ubuntu-latest
            python: "3.12"
            coverage: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Systémové knihovny pro Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Instalace
        run: python -m pip install -e ".[dev]"
      - name: pytest
        env:
          # sys.monitoring (Python 3.12+): výrazně menší zpomalení než výchozí trasování; bez --cov se nepoužije
          COVERAGE_CORE: sysmon
        run: >-
          python -m pytest -q --junitxml=pytest-${{ matrix.os }}-${{ matrix.python }}.xml
          ${{ matrix.coverage && '--cov=envocad --cov-report=xml --cov-report=term' || '' }}
      - name: Výsledky testů
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-${{ matrix.os }}-${{ matrix.python }}.xml
          retention-days: 7
      - name: Pokrytí kódu (coverage.xml)
        if: always() && matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalace
        run: python -m pip install -e ".[dev]"
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean envocad.spec
      - name: Smoke test sestavené aplikace
        shell: bash
        run: test -e dist/EnvoCAD/EnvoCAD || test -e dist/EnvoCAD/EnvoCAD.exe
      - uses: actions/upload-artifact@v4
        with:
          name: EnvoCAD-${{ runner.os }}
          path: dist/EnvoCAD
          retention-days: 7
