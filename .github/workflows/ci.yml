# Testy a build pro Linux i Windows na každém PR a pushi do main.
# Agentní PR (větve agent/*) při selhání opravuje workflow agent-fix-ci.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  guard:
    name: Licencovaná data a ruff
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install: "false"
      - name: Žádná data z EPLAN Data Portalu / datasheety v gitu
        run: python tools/check_licensed_data.py
      - name: ruff
        run: python -m pip install -q ruff && python -m ruff check .

  test:
    name: Testy (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        # vlastní runner (jen Linux): proměnné CI_OS = ["linux"], CI_PYTHON = ["3.14"]
        os: ${{ fromJSON(vars.CI_OS || '["linux", "windows"]') }}
        python: ${{ fromJSON(vars.CI_PYTHON || '["3.12", "3.14"]') }}   # 3.14 = lokální prostředí vývoje
    runs-on: ${{ matrix.os == 'windows' && 'windows-latest' || fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
        with:
          python-version: ${{ matrix.python }}
      - name: pytest
        run: python -m pytest -q --junitxml=pytest-${{ matrix.os }}-${{ matrix.python }}.xml
      - name: Výsledky testů
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-${{ matrix.os }}-${{ matrix.python }}.xml
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.CI_OS || '["linux", "windows"]') }}
    runs-on: ${{ matrix.os == 'windows' && 'windows-latest' || fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean envocad.spec
      - name: Smoke test sestavené aplikace
        shell: bash
        run: test -e dist/EnvoCAD/EnvoCAD || test -e dist/EnvoCAD/EnvoCAD.exe
      - uses: actions/upload-artifact@v4
        with:
          name: EnvoCAD-${{ runner.os }}
          path: dist/EnvoCAD
          retention-days: 7
