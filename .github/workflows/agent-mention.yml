# „@claude …“ v komentáři issue nebo PR (jen od vlastníka repa): agent zapracuje připomínky.
# Na PR pushne opravu do jeho větve, u issue odpoví nebo založí větev claude/…; main nikdy.
# Secrets a variables stejné jako agent-nightly.yml.
name: Agent – @claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: agent-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude:
    if: >-
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prostředí pro testy
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
          python -m pip install -e ".[dev]"
          { echo "QT_QPA_PLATFORM=offscreen"; echo "PYTHONUTF8=1"; } >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.AGENT_MODEL_OPUS || 'claude-opus-5-5' }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.AGENT_MODEL_SONNET || 'claude-sonnet-5-5' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.AGENT_MODEL_HAIKU || 'claude-haiku-5-5' }}
        with:
          anthropic_api_key: ${{ secrets.OMNIROUTE_API_KEY }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}   # PAT, aby push opravy spustil CI
          branch_prefix: "claude/"
          plugin_marketplaces: https://github.com/affaan-m/ECC.git
          plugins: ecc@ecc
          settings: |
            {"env": {"ECC_GATEGUARD": "off", "QT_QPA_PLATFORM": "offscreen", "PYTHONUTF8": "1"}}
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_ORCHESTRATOR || 'claude-fable-5-2' }}
            --max-turns 80
            --allowedTools "Agent,Task,Skill,TodoWrite,Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(QT_QPA_PLATFORM=offscreen pytest:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(git push --force:*),Bash(git push -f:*),Bash(gh api:*)"
            --append-system-prompt "Řiď se CLAUDE.md a .claude/agents/orchestrator.md. Na PR zapracuj připomínky vlastníka v rámci rozsahu PR, spusť pytest a ruff, záznam do changelog.d/ jen při nové funkci. Oborové otázky nedomýšlej – zeptej se v komentáři."
