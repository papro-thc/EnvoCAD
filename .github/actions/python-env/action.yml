# Python pro job: na GitHub runneru setup-python (+ systémové knihovny Qt na Ubuntu), na vlastním runneru (Linux bez apt,
# např. CachyOS) virtualenv ze systémového python3 – výběr runneru: proměnná repa RUNS_ON_LINUX, viz docs/AGENTS.md.
name: Python prostředí
description: Python, knihovny pro Qt a volitelně pip install -e .[dev]
inputs:
  python-version:
    description: Verze Pythonu (jen GitHub runner; vlastní runner bere systémový python3)
    default: "3.12"
  install:
    description: "true = pip install -e .[dev]"
    default: "true"
runs:
  using: composite
  steps:
    - if: runner.environment == 'github-hosted'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Systémové knihovny pro Qt (Ubuntu)
      if: runner.environment == 'github-hosted' && runner.os == 'Linux' && inputs.install == 'true'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
    - name: Virtualenv (vlastní runner)
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
    - name: Instalace
      if: inputs.install == 'true'
      shell: bash
      run: python -m pip install -q -e ".[dev]"
